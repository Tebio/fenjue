<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<title>焚诀 FENJUE · 操作台</title>
<style>
/* ── 焚诀 v2 · 浅色版（2026-09-27 用户裁「太黑了」：结构保留 v2，配色回浅色） ── */
:root{--bg:#fafaf9;--panel:#ffffff;--panel2:#f7f6f3;--text:#37352f;--muted:#9b9a97;--faint:#b5b4ad;
  --line:#ededeb;--line2:#e2e2de;--accent:#c0392b;--accent-dim:#e8c9c4;
  --up:#c0392b;--dn:#0f7b3d;--warn:#9a6b1a}
*{margin:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font:14px/1.65 ui-sans-serif,-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;font-variant-numeric:tabular-nums}
.wrap{max-width:880px;margin:0 auto;padding:0 14px 70px}
/* ── 顶部品牌+时钟 ── */
.brandbar{display:flex;justify-content:space-between;align-items:baseline;padding:20px 2px 12px;border-bottom:1px solid var(--line)}
.brand{font-size:19px;font-weight:800;letter-spacing:2px}
.brand small{display:block;font-size:10px;letter-spacing:3px;color:var(--faint);font-weight:500;margin-top:2px}
.clock{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}
.clock b{color:var(--text);font-size:15px}
/* ── Market Regime 状态条（不吸顶，随内容滚走；chips 单行紧凑，溢出横滑） ── */
.regimebar{background:var(--panel2);border:1px solid var(--line);border-radius:8px;
  padding:7px 11px;margin:10px 0 4px;display:flex;gap:6px;align-items:center;font-size:12px;
  flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
.regimebar::-webkit-scrollbar{display:none}
.regimebar .rg{font-size:14px;font-weight:800;letter-spacing:1px;flex:none}
.chip{border:1px solid var(--line2);border-radius:5px;padding:1px 7px;font-size:11px;color:var(--muted);white-space:nowrap;background:var(--panel);flex:none}
.chip b{color:var(--text);font-weight:600}
.chip.warn{border-color:var(--accent-dim);color:var(--warn);background:#fdf6ec}
.chip.bad{border-color:#e5b8b2;color:#c0392b;background:#fdeceb}
.chip.good{border-color:#b9d9c6;color:#0f7b3d;background:#edf5ee}
/* ── tab 导航 ── */
.tabbar{display:flex;gap:5px;margin-top:10px;position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:9;border-bottom:1px solid var(--line)}
.tabbtn{border:1px solid var(--line);background:var(--panel2);color:var(--muted);border-radius:6px;padding:7px 14px;font-size:13px;cursor:pointer;font-weight:500;font-family:inherit}
.tabbtn.active{background:var(--text);color:#fff;border-color:var(--text);font-weight:700}
.card[data-tab]{display:none}
.card[data-tab].showtab{display:block}
/* ── 卡片 ── */
.card{margin-top:16px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px}
.card>h2{font-size:13.5px;font-weight:700;letter-spacing:1px;color:var(--text);padding-bottom:8px;border-bottom:1px solid var(--line);margin-bottom:10px}
.hint{float:right;font-size:10.5px;font-weight:400;color:var(--faint);margin-top:3px;letter-spacing:0}
.muted{color:var(--muted);font-size:12px}
.small{font-size:11.5px;color:var(--muted)}
.statrow{display:flex;gap:32px;align-items:flex-start;flex-wrap:wrap}
.big{font-size:16px}
.num{font-size:21px;font-weight:700}
.badge{display:inline-block;padding:2px 10px;border-radius:4px;font-size:13px;font-weight:700}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;color:var(--muted);font-weight:500;font-size:11.5px;padding:4px 8px 4px 0;border-bottom:1px solid var(--line);white-space:nowrap;letter-spacing:.5px}
td{padding:6px 8px 6px 0;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:none}
details.card summary{font-size:13.5px;font-weight:700;padding-bottom:8px;border-bottom:1px solid var(--line);cursor:pointer;list-style:none;letter-spacing:1px}
details.card summary::before{content:"▸ ";color:var(--faint)}
details.card[open] summary::before{content:"▾ "}
details.card .cardbody{padding-top:12px}
details.card{border:none;background:var(--panel)}
/* ── KPI/行动 ── */
.up{color:var(--up)}.dn{color:var(--dn)}.ok{color:var(--dn);font-size:12px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:9px;margin:10px 0}
.kpi{border:1px solid var(--line);border-radius:7px;padding:10px 13px;background:var(--panel2)}
.kpi-head{display:flex;justify-content:space-between;align-items:center;gap:6px}
.kpi-name{font-weight:600;font-size:12.5px}
.pill{font-size:10.5px;padding:1px 8px;border-radius:20px;font-weight:600;flex:none}
.pill.ok{background:#e7f4ea;color:#1e7e34}
.pill.wp{background:#fdf3e3;color:#9a6b1a}
.kpi-big{font-size:20px;font-weight:800;margin-top:3px}
.kpi-big small{font-size:10.5px;font-weight:400;color:var(--muted)}
.kpi-line{font-size:11px;color:var(--muted);margin-top:3px;line-height:1.5}
.callout{display:flex;gap:11px;border-radius:7px;padding:11px 15px;margin:9px 0;font-size:13px;line-height:1.7;border:1px solid var(--line)}
.callout .ic{flex:none}
.c-gray{background:var(--panel2)}
.c-yellow{background:#fdf6e3;border-color:#ecdcb5}
.c-red{background:#fdeceb;border-color:#f0c8c3}
.c-green{background:#edf5ee;border-color:#c4dec9}
.step{display:flex;gap:12px;margin:11px 0}
.step .no{flex:none;width:23px;height:23px;border-radius:50%;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:2px;background:var(--panel2);border:1px solid var(--line2);color:var(--accent)}
.step .t{font-weight:700;font-size:13.5px}
.step .d{font-size:12.5px;color:var(--muted)}
.tag{display:inline-block;font-size:10.5px;padding:0 7px;border-radius:4px;background:var(--panel2);color:var(--muted);border:1px solid var(--line)}
.rule{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:10px 14px;font-size:12px;color:var(--muted);margin-bottom:12px;line-height:1.7}
.foot{margin-top:40px;padding-top:14px;border-top:1px solid var(--line);color:var(--faint);font-size:11px;line-height:1.8}
a{color:var(--accent)}
/* ── 今日最重要的3件事（首屏决策卡） ── */
.top3{border:1px solid var(--accent-dim);background:var(--panel)}
.top3 .t3{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.top3 .t3:last-child{border-bottom:none}
.top3 .rn{flex:none;width:22px;height:22px;border-radius:5px;background:var(--accent);color:#fff;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center}
.top3 .tt{font-weight:700;font-size:13.5px}
.top3 .dd{font-size:12px;color:var(--muted);line-height:1.6}
/* ── Portfolio cockpit ── */
.cockpit-nums{display:flex;gap:30px;flex-wrap:wrap;margin:6px 0 10px}
.cockpit-nums .cn .lab{font-size:11px;color:var(--faint);letter-spacing:1px}
.cockpit-nums .cn .val{font-size:20px;font-weight:800}
.riskbar{height:7px;background:var(--panel2);border-radius:4px;border:1px solid var(--line);overflow:hidden;margin:5px 0 3px}
.riskbar i{display:block;height:100%;background:var(--accent)}
.alloc{display:flex;height:9px;border-radius:4px;overflow:hidden;border:1px solid var(--line);margin:5px 0 3px}
.alloc i{display:block;height:100%}
</style></head><body><div class="wrap">
<div class="brandbar">
  <div class="brand">焚诀<small>FENJUE RESEARCH ENGINE</small></div>
  <div class="clock" id="clockbox"><b id="clock">--:--:--</b><br><span id="dateshow"></span></div>
</div>
<div class="regimebar" id="regimebar"><span class="chip">加载中…</span></div>
<div class="tabbar" id="tabbar">
<button class="tabbtn active" data-tab="今日">📋 今日</button>
<button class="tabbtn" data-tab="我的钱">💰 我的钱</button>
<button class="tabbtn" data-tab="研究库">🔬 研究库</button>
<button class="tabbtn" data-tab="证据库">🗂️ 证据库</button>
<button class="tabbtn" data-tab="影子">👻 影子</button>
</div>
<div id="dash"></div>
<div class="foot">焚诀 Research Engine · 数据 dashboard.json 自动重建：09:40 竞价后 / 10:40 雷达后 / 13:35 午后 / 14:50 尾盘 / 15:20 收盘快报 / 15:50 反转名单 / 16:15 委托单后 / 19:20 晚间 / 20:40 数据齐 · 交易日才轮询（ops-state 变化才重渲）<br>
非交易日不重建（显示最近交易日数据，版块日期戳为准）· 红涨绿跌 · 胜率均值均为净口径 · 所有策略结论带作废条件与 kill 线 · 研究辅助，不是买卖指令</div>
</div>
<script>
(function(){
var TABS=["今日","我的钱","研究库","证据库","影子"];
var btns=document.querySelectorAll(".tabbtn");
var curTab="今日";
function bjt(){var n=new Date();return new Date(n.getTime()+(n.getTimezoneOffset()+480)*60000);}
function show(tab){
  if(TABS.indexOf(tab)<0)tab="今日";
  curTab=tab;
  document.querySelectorAll(".card[data-tab]").forEach(function(c){
    c.classList.toggle("showtab", c.getAttribute("data-tab")===tab);
  });
  btns.forEach(function(b){b.classList.toggle("active", b.getAttribute("data-tab")===tab);});
  try{localStorage.setItem("fj_tab",tab);}catch(e){}
}
btns.forEach(function(b){b.onclick=function(){show(b.getAttribute("data-tab"));};});
try{curTab=localStorage.getItem("fj_tab")||"今日";}catch(e){}
// ── 品牌时钟（1s） ──
function clock(){
  var b=bjt();
  var el=document.getElementById("clock");
  if(el)el.textContent=("0"+b.getHours()).slice(-2)+":"+("0"+b.getMinutes()).slice(-2)+":"+("0"+b.getSeconds()).slice(-2);
  var ds=document.getElementById("dateshow");
  if(ds)ds.textContent=b.getFullYear()+"."+("0"+(b.getMonth()+1)).slice(-2)+"."+("0"+b.getDate()).slice(-2)+" 周"+"日一二三四五六"[b.getDay()];
}
setInterval(clock,1000);clock();
// ── 更新倒计时 ──
var SLOTS=["09:40","10:40","13:35","14:50","15:20","15:50","16:15","19:20","20:40"];
function next(){
  var n=new Date();
  for(var d=0;d<8;d++){
    var t=new Date(n.getFullYear(),n.getMonth(),n.getDate()+d);
    var wd=t.getDay();
    if(wd===0||wd===6)continue;
    for(var i=0;i<SLOTS.length;i++){
      var p=SLOTS[i].split(":");
      var s=new Date(t.getFullYear(),t.getMonth(),t.getDate(),+p[0],+p[1]);
      if(s>n)return s;
    }
  }
  return null;
}
function tick(){
  var s=next(),el=document.getElementById("cd");
  if(!el)return;
  if(!s){el.textContent="下次更新未知";return;}
  var ms=s-new Date(),h=Math.floor(ms/36e5),m=Math.ceil(ms%36e5/6e4);
  el.textContent="下次更新 "+(s.getHours()<10?"0":"")+s.getHours()+":"+(s.getMinutes()<10?"0":"")+s.getMinutes()+
    (h>0?"（"+h+"小时"+m+"分后）":"（"+m+"分钟后）");
}
// ── 实时报价（每次渲染后重挂）──
var liveTimer=null;
function paint(){
  var nodes=document.querySelectorAll("[data-q]");
  if(!nodes.length)return;
  var codes=[];nodes.forEach(function(n){var c=n.getAttribute("data-q");if(codes.indexOf(c)<0)codes.push(c);});
  var s=document.createElement("script");
  s.src="https://qt.gtimg.cn/q="+codes.join(",")+"&_="+Date.now();
  s.onload=function(){
    codes.forEach(function(c){
      var v=window["v_"+c];if(!v)return;
      var f=v.split("~");if(f.length<33)return;
      var price=parseFloat(f[3]),prev=parseFloat(f[4]);
      if(!(price>0)||!(prev>0))return;
      var r=(price/prev-1)*100;
      document.querySelectorAll('[data-q="'+c+'"]').forEach(function(n){
        var k=n.getAttribute("data-f");
        if(k==="p")n.textContent=price.toFixed(2);
        else if(k==="r"){var cls=r>0?"up":r<0?"dn":"muted";
          n.innerHTML='<span class="'+cls+'">'+(r>0?"+":"")+r.toFixed(2)+"%</span>";}
        else if(k==="z"){var buy=parseFloat(n.getAttribute("data-buy"));
          n.innerHTML=price<=buy?'<span class="up">🟢买入区内</span>':'<span class="muted">线上方'+((price/buy-1)*100).toFixed(1)+"%</span>";}
        else if(k==="j"){
          var j,jc;
          if(r>=9.7){j="🔥首板（只观察不挂单·G7死刑）";jc="up";}
          else if(r>=5){j="🟡冲板中（未封不买）";jc="up";}
          else if(r>=1.5){j="⚪跟风涨（非首板不买）";jc="muted";}
          else if(r>-1.5){j="⚪横盘蓄力（继续观察）";jc="muted";}
          else{j="🔴转弱（梯队热它跌=弱，别碰）";jc="dn";}
          n.innerHTML='<span class="'+jc+'" style="font-size:12px">'+j+"</span>";}
      });
    });
    var lp=document.getElementById("livepulse");
    if(lp){var n2=bjt();lp.textContent="实时 "+("0"+n2.getHours()).slice(-2)+":"+("0"+n2.getMinutes()).slice(-2)+":"+("0"+n2.getSeconds()).slice(-2);}
    s.remove();
  };
  s.onerror=function(){s.remove();};
  document.head.appendChild(s);
}
function startLive(){
  var b=bjt(),w=b.getDay(),m=b.getHours()*60+b.getMinutes();
  var live=(w>=1&&w<=5&&m>=555&&m<=905);
  paint();
  if(liveTimer){clearInterval(liveTimer);liveTimer=null;}
  if(live)liveTimer=setInterval(paint,30000);
}
// ── 时段指引 ──
function nownow(){
  var el=document.getElementById("nownow");if(!el)return;
  var el2=document.getElementById("nownow_card");  // 2026-09-27 修：行动卡里还有一个（重复id老bug）
  var b2=bjt(),w=b2.getDay(),m=b2.getHours()*60+b2.getMinutes();
  var msg,color="#e6e4dd";
  if(w===0||w===6){msg="📴 今天不开市。不用操作，想看就翻翻「研究库」。";}
  else if(m<565){msg="🌅 盘前：照「我的钱」页的银行委托单挂单。挂完收工。9:25 QQ 发作战单。";}
  else if(m<572){msg="⏳ 竞价中：别动手，等 9:32 确认。";}
  else if(m<585){msg="🟢 买入窗口（9:32-9:45）：行动单有票才买，没票=今天不买。";color="#e05a4d";}
  else if(m<630){msg="🪑 窗口已过。别追，等雷达班。";}
  else if(m<885){msg="🪑 现在什么都不用干。QQ 不喊你=没事。盯盘不产生收益。";}
  else if(m<900){msg="🔴 卖出窗口（14:45-15:00）：该卖的短线票现在卖，无论盈亏。";color="#4ea876";}
  else if(m<940){msg="📊 收盘了。等 19:05 权威周期轴+19:15 X规则线判定。";}
  else{msg="🌙 晚间：看「我的钱」页委托单，下个交易日 9:25 前照挂即可。";}
  el.textContent=msg;el.style.color=color;
  if(el2){el2.textContent=msg;el2.style.color=color;}
}
// ── Regime 状态条渲染 ──
function paintRegime(e){
  var bar=document.getElementById("regimebar");
  if(!bar||!e)return;
  var qcls=e.quadrant&&e.quadrant.indexOf("毒气室")>=0?"bad":(e.quadrant&&e.quadrant.indexOf("黄金")>=0?"good":"");
  bar.innerHTML='<span class="rg">'+e.regime+'</span>'
    +'<span class="chip">段龄 <b>第'+e.age+'天</b>/中位'+e.seg_median+'天</span>'
    +'<span class="chip">下阶段 <b>'+e.next_top+'</b> '+Math.round(e.next_prob*100)+'%</span>'
    +'<span class="chip">趋势门 <b>'+e.trend_gate+'</b></span>'
    +'<span class="chip">杠杆门 <b>'+e.margin_gate+'</b></span>'
    +(e.holiday?'<span class="chip warn">'+e.holiday+'</span>':'')
    +(e.quadrant?'<span class="chip '+qcls+'">深档 '+e.quadrant+'</span>':'')
    +' <span class="chip" style="margin-left:auto">数据截至 <b>'+e.data_day+'</b> · 构建 '+e.built_at+'</span>';
}
// ── 数据渲染 ──
function render(d){
  var y=window.scrollY;
  var el=document.getElementById("dash");
  var html="";
  for(var i=0;i<d.cards.length;i++)html+=d.cards[i].html;
  el.innerHTML=html;
  paintRegime(d.env);
  document.getElementById("subline") && (document.getElementById("subline").innerHTML="");
  show(curTab);
  tick();nownow();startLive();
  window.scrollY=y;
}
function load(){
  // 周末只加载一次不轮询；交易日先探 ops-state.json 的 built_at，没变不重渲
  var b=bjt(),w=b.getDay();
  if((w===0||w===6)&&window._loadedOnce){return;}
  window._loadedOnce=true;
  var _render_from=function(url){
    var x2=new XMLHttpRequest();
    x2.open("GET",url+"?t="+Date.now(),true);
    x2.onreadystatechange=function(){
      if(x2.readyState===4&&x2.status===200){
        try{render(JSON.parse(x2.responseText));}catch(e){}
      }
    };
    x2.send();
  };
  var x=new XMLHttpRequest();
  x.open("GET","ops-state.json?t="+Date.now(),true);
  x.onreadystatechange=function(){
    if(x.readyState===4){
      var changed=true;
      if(x.status===200){
        try{
          var os=JSON.parse(x.responseText);
          if(os.built_at&&os.built_at===window._lastBuilt){changed=false;}
          else{window._lastBuilt=os.built_at;}
        }catch(e){}
      }
      if(changed)_render_from("dashboard.json");
    }
  };
  x.send();
}
load();setInterval(load,60000);
})();
</script>
</body></html>
