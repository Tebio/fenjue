# data/datasets_registry.yaml — DATA-01 数据源注册表（数据面监控机的唯一输入）
#
# 一期只注册「真实在用」的 10 个数据集（spec 风险 4：宁少勿滥，注册表会腐）。
# 新增数据集：先加 consumers（若是新下游名），再加 datasets 条目，七字段缺一不可。
# golden tests/golden/oracle/data_health_snapshot.json 冻结本表声明——改任何一行都会
# 触发 golden 漂移，必须走 record + 台账说明（与 claims_registry 同纪律）。
#
# 字段契约（spec 接口契约）：
#   path      仓库相对路径（文件或目录）
#   date_expr freshness_core 语法："[-1].date" / "[-1].date|jsonl"（字段名任意）/
#             "[-1][N]"（list-of-list 末 bar 第 N 项，DATA-09）/ "_meta.date" /
#             "dir:last_bar[:字段]"（目录模式取最近写入者末 bar，本期只看末端日期不看覆盖率）/
#             "dir:last_bar[N]"（目录 list-of-list，跳过空/坏文件不计入样本，DATA-09）/
#             "none"（显式不检查：无机器可读日期 → unknown_date + freshness_unknown，
#              不许静默当 ok，DATA-09）
#   cadence   daily = 每交易日应更新（周末/假日滞后由交易日历吸收，不算断供）
#             static = 无日更预期（配合 date_expr "none" 使用）
#   max_lag   允许的最大滞后（交易日，官方日历口径）
#   severity  fatal（断供=下游结论不可信，cron 报红 exit 1）/ warn / info
#   blocks    断供时被静默污染的下游（必须 ∈ 下方 consumers 清单；fatal 不许为空）
#   owner     生产者（出事找谁）
registry_version: "1.1 (2026-10-20, DATA-09)"

# 规范消费者清单（golden 协议断言 c 的封闭世界；词汇与 spec 现状证据一致）
consumers:
  - 深档名单        # dashboard_build.deep_low_scan
  - 影子盘          # fen_shadow / claims_shadow
  - 周期仪          # regime_meter（含 regime_core 分位）
  - 权威时间轴      # regime_daily_append → regime_timeline_hcap / regime_log
  - X规则线         # xrules_daily
  - 作战单9:25      # ops_briefing（每日必发）
  - 面板20:40       # dashboard_build（含徽标）
  - 日度状态包      # build_daily_state → data/daily_state/（注意：当前零调用方，属预留）
  - 晨报            # 虚拟下游：line_health_report.md 的读者是人/agent，**无脚本生产者、无 cron**。
                    # 保留仅为记录该消费路径；breaker 不认它（无脚本调 allow("晨报")，登记到 EXEMPT 是死分支）
  - line_health     # 信号线监控机（算滚动 edge 的输入面）
  - 盘前自检        # preflight.py
  - 回测族          # regime_backtest_hcap 等读权威时间轴的回测

# 必注册集（spec 协议断言 d：防新数据集绕过注册；缺了 = unregistered + exit 1）
mandatory: [big_kcache, emotion_series, regime_timeline_hcap, ops_state, kcache]

datasets:
  big_kcache:                       # 前复权日K权威库 3377 票（baostock）
    path: data/big_kcache
    date_expr: "dir:last_bar"
    cadence: daily
    max_lag: 0
    severity: fatal                 # #330-A：冻在 10-16 三天，下游照常跑不报错
    blocks: [深档名单, 影子盘, 周期仪, 权威时间轴, X规则线]
    owner: engine/update_kcache.py（18:30/19:00 分片 + 21:00 兜漏）

  kcache:                           # 新浪线小缓存 21 票（线1影子在用；非全主板）
    path: data/kcache
    date_expr: "dir:last_bar:day"   # 新浪 schema 是 day 不是 date
    cadence: daily
    max_lag: 0
    severity: warn                  # 部分文件停更属已知（blindspot-2026check 待裁决），不挡主链
    blocks: [影子盘]
    owner: fen_shadow.py（线1影子随取随更）

  emotion_series:                   # 情绪六指标日序列（恐慌分位唯一来源，#329 遗留②）
    path: data/emotion_series.jsonl
    date_expr: "[-1].date|jsonl"
    cadence: daily
    max_lag: 0
    severity: fatal                 # 断了 = 腿一退 ABS_FALLBACK=38 + gap=true
    blocks: [周期仪, 权威时间轴]
    owner: engine/emotion_series.py（15:40 周期仪班）

  regime_timeline_hcap:             # regime 权威时间轴（G3 闸门/回测/面板源）
    path: data/regime_timeline_hcap.json
    date_expr: "[-1].date"
    cadence: daily
    max_lag: 0
    severity: fatal                 # #330-B：曾静默停更两天 cron 还报 ok
    blocks: [面板20:40, 日度状态包, 回测族]
    owner: engine/regime_daily_append.py（18:35 班）

  ops_state:                        # 人机共驾舱单一事实源（作战单直接读）
    path: docs/ops-state.json
    date_expr: "sig_date"
    cadence: daily
    max_lag: 0
    severity: fatal                 # 作战单每日必发，吃旧 sig_date = 给过期指令
    blocks: [作战单9:25, 盘前自检]
    owner: engine/dashboard_build.py（20:40 面板班写出）

  index_sh000001:                   # 上证指数日K（regime 判定与日历回退的基准）
    path: data/index_sh000001.json
    date_expr: "[-1].date"
    cadence: daily
    max_lag: 0
    severity: fatal
    blocks: [权威时间轴, 周期仪]
    owner: engine/update_kcache.py（update_index 段）

  regime_log:                       # 面板徽标源（regime_daily_append 覆盖写）
    path: data/regime_log.jsonl
    date_expr: "[-1].date|jsonl"
    cadence: daily
    max_lag: 0
    severity: warn                  # 徽标停更是体验问题，timeline 才是闸门
    blocks: [面板20:40]
    owner: engine/regime_daily_append.py（18:35 班）

  xrules_state:                     # X规则线状态（T1-MEGA/X3，作战单第 3 段）
    path: data/xrules_state.json
    date_expr: "date"
    cadence: daily
    max_lag: 0
    severity: warn                  # 自带 failure_streak 告警，此处只补「日期面」视角
    blocks: [作战单9:25, 面板20:40]
    owner: engine/xrules_daily.py

  line_health:                      # 信号线监控机输出（监控机的监控）
    path: data/line_health.json
    date_expr: "_meta.date"
    cadence: daily
    max_lag: 0
    severity: warn
    # 2026-10-20 清口，**含一次自我纠错**：先按"作战单9:25"改，实测发现 ops_briefing.py 根本不读 line_health（grep 零命中），
    # 那是我未经核实就采信咨询结论造成的新假账，已回滚。实测唯一读 line_health.json 的脚本是 build_daily_state.py:228，
    # 即「日度状态包」——它是**经代码验证**的真实消费者（虽然该脚本当前零 cron 调用方，仍是唯一实现）。
    # 「晨报」无脚本消费（report.md 的读者是人/agent），已从 blocks 摘除、保留在 consumers 里标注虚拟下游。
    blocks: [日度状态包]
    owner: engine/line_health.py

  watch_pool:                       # 观察池（状态制；updated 不保证每个交易日都动）
    path: data/watch_pool.json
    date_expr: "updated"
    cadence: daily
    max_lag: 1
    severity: info
    blocks: [日度状态包, 面板20:40]
    owner: engine/watch_pool.py

  # ── DATA-09（2026-10-20）：detector 闭包三大盲区 + 影子账本纳管 ──────────────
  # 背景：_XFUND/_XCAP/_IND 三个 detector 全局的数据源此前完全未纳管，data_health 对它们
  # 失明；claims_shadow 10-19 零产出（10-15 1492 条 → 10-16 108 条 → 10-19 0 条）三重盲区
  # 叠加无人发现。severity 一律 warn/info 不用 fatal——断供时主张审计仍要跑、跑出来打
  # data_stale 标记（DATA-07 已定 DEGRADE_MARK 语义），比全线停摆有用。

  fund_cache:                       # 估值/风险缓存 3377 票（peTTM/isST；_XFUND 源，9 条主张）
    path: data/fund_cache
    date_expr: "dir:last_bar[0]"    # list-of-list 末 bar 第 0 项=日期；71 个空数组文件 mtime
                                    # 最新（2026-10-20 实测），空文件跳过不计入样本
    cadence: daily
    max_lag: 1
    severity: warn                  # DEGRADE_MARK：审计照跑打 data_stale，不全线停摆
    blocks: [影子盘, line_health]
    owner: engine/fetch_fundamentals.py（手动分片抓取，无 cron；最近一批 2026-09-18，tmp/launch_fund.sh）

  cap_hist:                         # 流通市值历史 3368 票（_XCAP 源，5 条主张）
    path: data/cap_hist
    date_expr: "dir:last_bar[0]"    # mtime 不可信实证：000001.json mtime 10-03 内容停在 09-18
    cadence: daily
    max_lag: 5                      # 市值是慢变量，容忍 5 个交易日（比估值宽）
    severity: warn
    blocks: [影子盘, line_health]
    owner: engine/fetch_cap_history.py（手动抓取，无 cron）

  industry_map:                     # 行业映射 5546 键（_IND 源，3 条主张）
    path: data/industry_map.json
    date_expr: "none"               # 无日期字段，不许编——显式不检查 → unknown_date +
                                    # freshness_unknown:true，不检查必须显式可见（契约基线 §1）
    cadence: static
    max_lag: 0                      # 占位（none 短路不参与滞后判定；validate 要求非负整数）
    severity: info
    blocks: []
    owner: 内部维护（人工；engine/scripts 无自动生产者，2026-10-20 实测 grep 零命中）
    note: "内部维护，无自动时间戳，靠人工复核"

  claims_shadow:                    # 主张影子账本（10-15 1492 条→10-16 108 条→10-19 0 条无人发现）
    path: data/claims_shadow.jsonl
    date_expr: "[-1].signal_date|jsonl"   # 字段名是 signal_date 不是 date（2026-10-20 实测）
    cadence: daily
    max_lag: 1                      # ⚠️ 与任务书表格(max_lag=2)的偏离，理由见 AGENTS #346：
                                    # 滞后按交易日口径，10-16→10-20 lag=2，max_lag=2 今天判 ok，
                                    # 与验收「必须报出 claims_shadow stale」直接冲突；取 1 使其如实报红
    severity: warn
    blocks: [影子盘]
    owner: engine/claims_shadow.py（stock_claims_shadow.py 班 82e54a0a812f）
